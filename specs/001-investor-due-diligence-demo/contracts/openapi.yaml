openapi: 3.1.0
info:
  title: QuantumRegTech Assessment API
  version: 0.1.0-draft
  description: Draft contract for the deep-demo FastAPI service. All values must carry provenance and data status.
servers:
  - url: http://localhost:8000/api/v1
paths:
  /companies:
    get:
      summary: List configured company universe
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: universe_version
          schema: { type: string }
        - in: query
          name: limit
          description: Page size; server applies a configured maximum.
          schema: { type: integer, minimum: 1, default: 50 }
        - in: query
          name: cursor
          schema: { type: string }
      responses:
        '200': { description: Company records and universe metadata }
  /universes/{universe_id}/companies:
    post:
      summary: Register/import a ticker into a configured universe
      description: Requires authorized data-maintainer access. A ticker with incomplete source fields is marked pending_data and is not presented as analysis-ready.
      parameters:
        - in: path
          name: universe_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ticker, source_reference]
              properties:
                ticker: { type: string, minLength: 1 }
                source_reference: { type: string, minLength: 1 }
                source_version: { type: string }
      responses:
        '201': { description: Created/pending-data universe entry and missing-field list }
        '409': { description: Ticker already exists in this universe }
  /analysis/sessions:
    post:
      summary: Create analysis session
      responses:
        '201': { description: Session ID, demo/live state, and selected data version }
  /analysis/sessions/{session_id}/stocks:
    put:
      summary: Set selected tickers for the portfolio session; selection policy is configured independently of universe size
      parameters:
        - in: path
          name: session_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tickers]
              properties:
                tickers: { type: array, uniqueItems: true, items: { type: string } }
                universe_version: { type: string }
                selection_policy_id: { type: string }
      responses:
        '200': { description: Selected tickers and validation warnings }
  /companies/{ticker}/assessment:
    get:
      summary: Get financial, ESG, OSINT, and risk view with provenance
      parameters:
        - in: path
          name: ticker
          required: true
          schema: { type: string }
      responses:
        '200': { description: Assessment view }
  /graph/status:
    get:
      summary: Check graph database readiness without returning graph contents
      responses:
        '200':
          description: Graph connection state
          content:
            application/json:
              schema:
                type: object
                required: [state, configured, connected]
                properties:
                  state: { type: string, enum: [disabled, unavailable, ready_empty, ready] }
                  configured: { type: boolean }
                  connected: { type: boolean }
  /osint/scans:
    post:
      summary: Run bounded OSINT agent workflow for selected tickers
      description: Synchronous demo scan accepts up to four analysis-ready tickers. The graph workflow performs discovery, read-only Neo4j enrichment, extraction, LLM proposals, and evidence validation. Findings remain unverified.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tickers]
              properties:
                tickers:
                  type: array
                  minItems: 1
                  maxItems: 4
                  uniqueItems: true
                  items: { type: string }
      responses:
        '200': { description: Search candidates, agent workflow, graph match state, and LLM proposals when configured }
        '422': { description: Unknown or unsupported ticker }
  /osint/scans/{scan_id}:
    get:
      summary: Get scan candidates and source evidence
      responses:
        '200': { description: Candidate findings, each unverified until reviewed }
  /osint/findings/{finding_id}/review:
    post:
      summary: Approve, reject, or adjust one candidate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, reviewer_id]
              properties:
                decision: { type: string, enum: [approve, reject, adjust] }
                reviewer_id: { type: string }
                approved_severity: { type: integer, minimum: 0, maximum: 3 }
                reason: { type: string }
      responses:
        '200': { description: Review event and recalculated proposed risk impact }
  /portfolio/optimize:
    post:
      summary: Run deterministic optimizer and validate result
      responses:
        '200': { description: Scenario result, solver metadata, constraints, and data gaps }
        '422': { description: Infeasible constraints or incomplete required input }
  /documents:
    post:
      summary: Create private-document processing session
      responses:
        '201': { description: Document session; browser-local mode is preferred }
  /documents/{document_id}/extract:
    post:
      summary: Extract or validate page-cited metrics
      responses:
        '200': { description: Proposed fields with page/quote and validation state }
  /documents/{document_id}/review:
    post:
      summary: Approve/reject extracted fields for private assessment
      responses:
        '200': { description: Review outcome and updated private assessment only }
  /reports:
    post:
      summary: Compose report from approved evidence and calculated records
      responses:
        '200': { description: Printable report data and source appendix }
