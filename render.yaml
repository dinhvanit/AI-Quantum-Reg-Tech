# Render Blueprint – backend FastAPI only (frontend on Vercel, auth DB on Neon).
# Secrets are declared with sync: false → enter them in the Render dashboard, never here.
services:
  - type: web
    name: quantumregtech-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: CORS_ORIGINS
        sync: false            # https://<app>.vercel.app (no trailing slash)
      - key: FIRECRAWL_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OSINT_VERIFY_SOURCES
        value: "false"
      - key: OSINT_JINA_FALLBACK
        value: "false"
      - key: NEO4J_ALLOW_DEMO_WRITE
        value: "false"
